name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: agentic-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A build that succeeds isn't enough: the image built fine even when
      # the corpus JSON was missing from git, and only /ask would break.
      - name: Smoke test - corpus is baked into the image
        run: |
          docker run --rm agentic-rag:ci python -c "from agentic_rag.rag.corpus import load_corpus_index; n = len(load_corpus_index()); assert n > 1000, n; print('articles in image:', n)"

      # Same reasoning, for the frontend: the StaticFiles mount depends on
      # frontend/ having been COPY'd into both Docker stages (see
      # Dockerfile) -- a missing COPY would still build fine and only 404
      # at request time, same failure shape as the corpus bug above.
      - name: Smoke test - frontend is served and API routes aren't shadowed
        run: |
          docker run -d --rm --name agentic-rag-smoke -p 8000:8000 \
            -e OPENAI_API_KEY=ci-smoke-test-not-called \
            agentic-rag:ci
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/ | grep -q "المساعد القانوني"
          docker stop agentic-rag-smoke
