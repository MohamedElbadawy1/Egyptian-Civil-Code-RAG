name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: agentic-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A build that succeeds isn't enough: the image built fine even when
      # the corpus JSON was missing from git, and only /ask would break.
      - name: Smoke test - corpus is baked into the image
        run: |
          docker run --rm agentic-rag:ci python -c "from agentic_rag.rag.corpus import load_corpus_index; n = len(load_corpus_index()); assert n > 1000, n; print('articles in image:', n)"
