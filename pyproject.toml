[project]
name = "agentic-rag"
version = "0.1.0"
description = "Arabic legal RAG assistant over the Egyptian Civil Code"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "weaviate-client>=4.9",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mlflow>=2.15",
    "datasets>=5.0.1",
    "ragas>=0.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "dvc",
    "ragas>=0.2",
    "datasets>=2.20",
    # ragas imports ChatVertexAI from langchain-community unconditionally
    # at module load time (even though we only use OpenAI) - that class
    # was removed from langchain-community in 0.4.2, breaking `import
    # ragas` entirely. Pin below that until ragas fixes the import.
    "langchain-community<0.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]
